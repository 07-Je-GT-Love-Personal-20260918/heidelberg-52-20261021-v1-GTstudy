<!doctype html><html lang="zh"><meta charset="utf-8"><title>GTstudy 本地滚动测量</title><style>body{font:15px system-ui;margin:0;background:#f3f5f8;color:#21314b}header{padding:16px;display:flex;gap:15px;align-items:center}button{padding:10px 16px;border:1px solid #bdc9db;background:#fff;border-radius:8px;cursor:pointer}iframe{border:0;width:100%;height:780px;background:white}pre{white-space:pre-wrap;padding:20px;margin:0}small{color:#60718a}</style><header><b>本地滚动测量</b><button id="old">测量V1</button><button id="new">测量V2</button><small>相同视口、6秒、每秒3000px；脚本滚动测试，不代表所有设备。</small></header><pre id="result">等待开始</pre><iframe id="frame" title="待测阅读页"></iframe><script>
const out=document.querySelector('#result'),frame=document.querySelector('iframe'),results={};
async function measure(version){document.querySelectorAll('button').forEach(b=>b.disabled=true);out.textContent='正在测量 '+version+'…';frame.src=version==='v1'?'baseline/index.html':'../dist/index.html';await new Promise(resolve=>frame.onload=resolve);const win=frame.contentWindow,doc=frame.contentDocument;doc.documentElement.style.scrollBehavior='auto';let tasks=[],observer;try{observer=new win.PerformanceObserver(list=>tasks.push(...list.getEntries().map(t=>t.duration)));observer.observe({type:'longtask',buffered:false})}catch{}const nodes=doc.querySelectorAll('*').length;const gaps=[];let start,last;await new Promise(resolve=>{function tick(now){if(!start){start=now;last=now}const elapsed=now-start;if(elapsed>6000){resolve();return}gaps.push(now-last);last=now;win.scrollTo({top:elapsed*3,behavior:'instant'});win.requestAnimationFrame(tick)}win.requestAnimationFrame(tick)});observer?.disconnect();const data=gaps.slice(1).sort((a,b)=>a-b);results[version]={nodes,frames:data.length,seconds:6,p50_frame_ms:+data[Math.floor(data.length*.5)].toFixed(2),p95_frame_ms:+data[Math.floor(data.length*.95)].toFixed(2),frames_over_50ms:data.filter(x=>x>50).length,longtasks:tasks.length,longtask_total_ms:+tasks.reduce((a,b)=>a+b,0).toFixed(2),method:'scripted native scrolling 3000px/s for 6s in same-origin iframe; no wheel simulation'};out.textContent=JSON.stringify(results,null,2);document.querySelectorAll('button').forEach(b=>b.disabled=false)}
document.querySelector('#old').onclick=()=>measure('v1');document.querySelector('#new').onclick=()=>measure('v2');
</script></html>
