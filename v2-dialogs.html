<div id="selection-tools" class="selection-tools" role="toolbar" aria-label="文字重点标记" hidden><span id="selection-preview"></span><button data-mark-preset="focus">🖍 重点</button><button data-mark-preset="definition">定义</button><button data-mark-preset="difficulty">难点</button><button data-mark-preset="contrast">对照</button><button data-mark-preset="conclusion">结论区块</button><button id="mark-custom">自定义 · 批注</button><button id="selection-close" aria-label="关闭标记工具">×</button></div>
<dialog id="mark-editor" class="modal"><form id="mark-form"><div class="modal-heading"><div><span class="eyebrow">ANNOTATE & REMEMBER</span><h2>让重点一眼可见</h2></div><button type="button" data-close-dialog aria-label="关闭">×</button></div><blockquote id="mark-quote"></blockquote><div class="annotation-fields"><label><input type="checkbox" name="bold"> 加粗</label><div><label><input type="checkbox" name="ink"> 字体颜色</label><select name="inkColor" aria-label="字体颜色"><option value="blue">蓝</option><option value="green">绿</option><option value="purple">紫</option><option value="red">红</option><option value="amber">琥珀</option></select></div><div><label><input type="checkbox" name="fill"> 底纹颜色</label><select name="fillColor" aria-label="底纹颜色"><option value="amber">琥珀</option><option value="blue">蓝</option><option value="green">绿</option><option value="purple">紫</option><option value="red">红</option></select></div><div><label>文字下方线条 <select name="line"><option value="none">不加线</option><option value="solid">实线</option><option value="dashed">虚线</option><option value="dotted">点线</option><option value="wavy">波浪线</option></select></label><select name="lineColor" aria-label="线条颜色"><option value="blue">蓝</option><option value="amber">琥珀</option><option value="red">红</option><option value="purple">紫</option><option value="green">绿</option></select></div><label><input type="checkbox" name="block"> 整段区块强调</label></div><label for="mark-note">我的批注</label><textarea id="mark-note" rows="4" maxlength="10000" placeholder="为什么重要？与哪一课相连？"></textarea><p class="caption">可叠加多种样式；重叠标记分别保存，删除一项不会抹掉其他项。</p><div class="modal-actions"><button type="button" data-close-dialog>取消</button><button type="submit" class="primary">保存标记</button></div></form></dialog>
<dialog id="notes-library" class="modal notebook"><div class="modal-heading"><div><span class="eyebrow">MY STUDY COLLECTION</span><h2>标记与笔记</h2></div><button data-close-dialog aria-label="关闭笔记面板">×</button></div><p id="notes-summary"></p><div class="notebook-tools"><input type="search" id="notes-filter" placeholder="查找摘录或批注…" aria-label="查找笔记"><button id="notes-export">导出全部</button><label class="button">导入记录<input id="notes-import" type="file" accept="application/json" hidden></label><button id="undo-mark" disabled>撤销删除</button></div><div class="notebook-tabs"><button data-notebook-tab="marks" aria-pressed="true">划词标记</button><button data-notebook-tab="notes" aria-pressed="false">课堂笔记</button></div><div id="notes-list"></div><p class="caption">仅本机保存。换域名或设备请导出再导入；导入会按记录ID合并，不覆盖现有不同标记。</p></dialog>
